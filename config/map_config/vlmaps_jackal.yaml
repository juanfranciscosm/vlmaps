map_type: "vlmap"

pose_info:
  pose_type: camera_base
  rot_type: "quat"

  # Ignorados cuando pose_type=camera_base,
  # pero se mantienen porque Map espera estas claves.
  camera_height: 0.0
  base2cam_rot: [1, 0, 0,
                 0, 1, 0,
                 0, 0, 1]
  base_forward_axis: [1, 0, 0]
  base_left_axis: [0, 0, 1]
  base_up_axis: [0, 1, 0]

# PRUEBA: procesar solo 1 de cada 20 frames.
skip_frame: 20

# Isaac Sim camera intrinsics
cam_calib_mat:
  [1108.5125, 0.0, 640.0,
   0.0, 1108.5125, 360.0,
   0.0, 0.0, 1.0]

grid_size: ${params.gs}
cell_size: ${params.cs}

depth_sample_rate: 100

dilate_iter: 3
gaussian_sigma: 1.0

customize_obstacle_map: False

potential_obstacle_names:
  - "chair"
  - "wall"
  - "table"
  - "box"
  - "floor"
  - "other"

obstacle_names:
  - "wall"
  - "chair"
  - "table"
  - "box"
  - "other"

categories: "mp3d"
